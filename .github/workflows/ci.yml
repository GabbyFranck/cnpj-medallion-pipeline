name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint + unit tests (Python 3.11, Java 17)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: flake8
        run: flake8 src dags tests

      - name: black
        run: black --check src dags tests

      - name: pytest
        run: python -m pytest

  docker:
    name: Docker stack (make up / make lint / make test)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Create .env (same target used by make up)
        run: make .env && cat .env

      - name: Build image
        run: docker compose build

      - name: make lint (inside the image)
        run: make lint

      - name: make test (inside the image)
        run: make test

      - name: Start stack
        run: docker compose up -d

      - name: Wait for Airflow webserver and scheduler
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/health | tee /tmp/health.json | grep -q '"scheduler": {[^}]*"status": "healthy"'; then
              cat /tmp/health.json; exit 0
            fi
            sleep 5
          done
          echo "Airflow did not become healthy"; cat /tmp/health.json || true; exit 1

      - name: DAG loads without import errors
        run: |
          docker compose exec -T airflow-scheduler airflow dags reserialize
          errors=$(docker compose exec -T airflow-scheduler airflow dags list-import-errors -o plain)
          echo "$errors"
          echo "$errors" | grep -q "No data found"
          docker compose exec -T airflow-scheduler airflow dags list -o plain | grep cnpj_medallion
          docker compose exec -T airflow-scheduler airflow tasks list cnpj_medallion --tree

      - name: Spark pool exists
        run: docker compose exec -T airflow-scheduler airflow pools get spark

      - name: Run resolve_release against the real mirror
        run: docker compose exec -T airflow-scheduler airflow tasks test cnpj_medallion resolve_release

      - name: Container logs
        if: failure()
        run: docker compose logs --no-color --tail=300

      - name: Tear down
        if: always()
        run: docker compose down -v
